name: Gold Standard CI

on:
  push:
    branches: [main, l3-gold-standard]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Held-out IoT suite
        run: python benchmarks/heldout_suite.py
      - name: Minimal example
        run: python examples/minimal.py
      - name: Complete example
        run: python examples/complete.py
      - name: Smoke run
        run: python run.py
      - name: Upload held-out results
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: f50-heldout-results
          path: benchmarks/heldout_results.json
